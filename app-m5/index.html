<title>WORDPLAY Horizons</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&display=swap">
<style>
/* Layout: one app column. Home = stage hero + today + journey + stats. Session = top bar, one continuous stage, thumb zone. Single deliberate dark theatre look. */
:root{
  color-scheme: dark;
  --bg:#1B1230; --bg2:#2B1B48; --curtain:#5A1530; --curtain2:#3A0F22;
  --paper:#FFF7EA; --paper2:#F3E6CF; --ink:#22172F; --muted:#6E5F7C; --soft:#B9A9C9;
  --listen:#FF7A59; --gap:#F2B33D; --recall:#8F7CFF; --intro:#3FC1C9; --match:#E85D9C; --scene:#4FB06B; --pick:#5B8CFF; --reverse:#2EC4B6;
  --ok:#1FA978; --okbg:#DDF6EC; --okink:#0E5A3E; --bad:#E5485A; --badbg:#FDE6E8; --badink:#7D1F2B; --gold:#FFD27A; --gold2:#F2B33D;
  --f-he:"Fredoka","Rubik",system-ui,sans-serif; --f-body:"Rubik",system-ui,sans-serif; --f-en:"Fraunces",Georgia,serif;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--paper);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;overflow:hidden;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(60% 34% at 50% -4%, rgba(255,210,122,.24), transparent 70%),
  radial-gradient(40% 30% at 15% 100%, rgba(232,93,156,.14), transparent 70%),
  radial-gradient(40% 30% at 90% 85%, rgba(63,193,201,.12), transparent 70%),
  linear-gradient(180deg, var(--bg2), var(--bg) 60%)}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;box-sizing:border-box;
  padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px));padding-block:8px 12px;gap:10px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,.sbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate}
.fatal{margin:auto;background:var(--paper);color:var(--ink);border-radius:20px;padding:20px;font-size:16px}

/* Margo faces */
.margo .f-h,.margo .f-w,.margo .f-s{display:none}
.margo[data-face="h"] .f-n,.margo[data-face="w"] .f-n,.margo[data-face="s"] .f-n{display:none}
.margo[data-face="h"] .f-h,.margo[data-face="w"] .f-w,.margo[data-face="s"] .f-s{display:inline}
.host.hop svg{animation:hop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{35%{transform:translateY(-8px) rotate(-6deg)}70%{transform:translateY(1px) rotate(2deg)}}

/* ---------- home ---------- */
.hbar{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.logo{font-weight:800;font-size:22px;letter-spacing:1px;color:var(--paper)}
.logo i{font-style:italic;color:var(--listen);font-weight:800}
.hbar-r{display:flex;gap:8px;align-items:center}
.sync{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:999px;background:rgba(255,247,234,.08);font-size:12px;font-family:var(--f-he);font-weight:600;color:var(--soft)}
.sync b{width:8px;height:8px;border-radius:50%;background:#B9A9C9}
.sync.synced b{background:#3DDC97;box-shadow:0 0 8px #3DDC97}.sync.connecting b{background:var(--gold);animation:blink 1s infinite}.sync.error b{background:var(--bad)}
@keyframes blink{50%{opacity:.3}}
.icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,247,234,.08);color:var(--paper);flex:none}
.icon-btn.dark{background:var(--paper2);color:var(--ink)}
.hero{position:relative;flex:none;height:250px;border-radius:26px;overflow:hidden;background:
  radial-gradient(55% 70% at 30% 20%, rgba(255,226,160,.35), transparent 70%),
  linear-gradient(180deg,#3B2160,#24153D);box-shadow:inset 0 0 0 1px rgba(255,210,122,.18)}
.curtain{position:absolute;top:0;bottom:0;width:22%;background:repeating-linear-gradient(90deg,var(--curtain) 0 14px,var(--curtain2) 14px 22px);box-shadow:0 0 30px rgba(0,0,0,.5);animation:sway 7s ease-in-out infinite}
.curtain.l{left:0;border-radius:0 0 60% 0;transform-origin:top left}.curtain.r{right:0;border-radius:0 0 0 60%;transform-origin:top right;animation-delay:-3s}
@keyframes sway{50%{transform:skewX(1.5deg)}}
.spot{position:absolute;left:8%;bottom:6%;width:46%;height:26%;border-radius:50%;background:radial-gradient(closest-side, rgba(255,226,160,.45), transparent);animation:spot 4s ease-in-out infinite}
@keyframes spot{50%{opacity:.6}}
.floor{position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(180deg,#7A3E1F,#4E2512);box-shadow:inset 0 3px 0 rgba(255,210,122,.25)}
.hero .hero-fig{position:absolute;left:7%;bottom:6%;width:40%;max-width:160px;height:auto;border-radius:0;z-index:2}
.hero-fig svg{width:100%!important;height:auto!important;display:block;animation:idle 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes idle{50%{transform:translateY(-3px) rotate(-1deg)}}
.margo-full .arm-r{transform-origin:94px 110px;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-10deg)}90%{transform:rotate(6deg)}}
.hero-say{position:absolute;right:5%;top:10%;width:52%;background:var(--paper);color:var(--ink);border-radius:18px 18px 4px 18px;padding:10px 12px;box-shadow:0 12px 26px rgba(0,0,0,.35);z-index:3;animation:pop .4s cubic-bezier(.3,1.6,.5,1) .2s both}
.hero-say .who{font-family:var(--f-he);font-weight:700;font-size:12px;color:#B0283A}
.hero-say p{margin:2px 0 0;font-family:var(--f-he);font-weight:600;font-size:15px;line-height:1.35;text-wrap:pretty}
.today{display:flex;flex-direction:column;gap:9px}
.plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.plan div{background:rgba(255,247,234,.07);border:1px solid rgba(255,247,234,.1);border-radius:16px;padding:8px 6px;text-align:center}
.plan b{display:block;font-family:var(--f-he);font-size:24px;line-height:1.1;color:var(--gold)}
.plan span{font-size:12.5px;color:var(--soft)}
.go{position:relative;min-height:64px;border-radius:20px;background:linear-gradient(180deg,#FFE29A,#F2B33D);color:var(--ink);font-family:var(--f-he);font-weight:700;font-size:23px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 0 #B98A2B, 0 16px 34px rgba(242,179,61,.3);overflow:hidden}
.go::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{left:-50%}100%{left:130%}}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #B98A2B}
.go[disabled]{opacity:.5}
.note{margin:0;text-align:center;font-size:12.5px;color:var(--soft)}
.sec-t{font-family:var(--f-he);font-weight:700;font-size:14px;color:var(--soft);margin-bottom:6px}
.chaps{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}
.chaps::-webkit-scrollbar{display:none}
.chap{flex:0 0 78%;scroll-snap-align:start;border-radius:20px;padding:12px 14px;background:linear-gradient(160deg, color-mix(in srgb, var(--c) 30%, #2B1B48), #241539);border:1px solid color-mix(in srgb, var(--c) 45%, transparent);box-sizing:border-box}
.chap.soon{flex-basis:44%;opacity:.6;display:flex;flex-direction:column;justify-content:center}
.chap-t{font-family:var(--f-he);font-weight:700;font-size:17px}
.chap-s{font-size:12.5px;color:var(--soft);display:flex;gap:4px;align-items:center}
.nodes{display:flex;align-items:flex-start;gap:4px;margin-top:10px}
.node{display:flex;flex-direction:column;align-items:center;gap:5px;flex:0 0 auto;width:86px}
.ring{width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%), rgba(255,247,234,.12) 0);display:flex;align-items:center;justify-content:center}
.ring span{width:38px;height:38px;border-radius:50%;background:#241539;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--paper)}
.node.cur .ring{box-shadow:0 0 0 3px rgba(255,210,122,.35), 0 0 18px color-mix(in srgb, var(--c) 60%, transparent)}
.node.locked{opacity:.5}
.node-t{font-size:12px;text-align:center;line-height:1.25;color:var(--paper)}
.link{flex:1;height:3px;margin-top:23px;border-radius:3px;background:rgba(255,247,234,.18)}
.stats{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
.stats>div{background:rgba(255,247,234,.06);border-radius:16px;padding:8px 10px}
.stats b{display:block;font-family:var(--f-he);font-size:22px;line-height:1.1}
.stats span{font-size:12px;color:var(--soft);line-height:1.3}
.stats i{font-style:normal;opacity:.7;font-size:11px}
.week{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.week i{width:12px;height:12px;border-radius:4px;background:rgba(255,247,234,.14)}
.week i.on{background:var(--gold);box-shadow:0 0 8px rgba(255,210,122,.6)}
.week span{flex-basis:100%}

/* ---------- session ---------- */
.top{position:relative;display:flex;align-items:center;gap:8px;min-height:46px}
.host{width:44px;height:44px;flex:none;border-radius:50%}
.host svg{width:44px;height:44px;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.quip{position:absolute;top:2px;right:52px;max-width:min(270px, calc(100% - 64px));background:var(--paper);color:var(--ink);font-family:var(--f-he);font-weight:600;font-size:14px;line-height:1.35;padding:7px 11px;border-radius:4px 14px 14px 14px;box-shadow:0 10px 24px rgba(0,0,0,.35);z-index:20;opacity:0;transform:translateX(6px) scale(.96);transition:opacity .2s,transform .2s;pointer-events:none}
.quip.on{opacity:1;transform:none}
.track{position:relative;flex:1;height:12px;border-radius:9px;background:rgba(255,247,234,.12);overflow:visible}
.fill{height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--gold),var(--listen),var(--match));transition:width .35s ease;box-shadow:0 0 12px rgba(255,122,89,.45)}
.combo{font-family:var(--f-he);font-weight:700;font-size:13px;color:var(--gold);white-space:nowrap}
.combo.up{animation:cup .4s ease-out}
@keyframes cup{40%{transform:scale(1.35)}}
.stage-wrap{flex:1;min-height:0;display:flex;align-items:center}
.stage{position:relative;flex:1 1 auto;max-height:100%;min-height:0;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);border-radius:26px;overflow:hidden;
  background-image:radial-gradient(color-mix(in srgb, var(--type, #F2B33D) 14%, transparent) 1.2px, transparent 1.4px);background-size:14px 14px;
  box-shadow:0 2px 0 rgba(255,255,255,.6) inset, 0 18px 40px rgba(0,0,0,.45), 0 0 0 3px color-mix(in srgb, var(--type, #F2B33D) 35%, transparent)}
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:linear-gradient(90deg, var(--type, var(--gold)), color-mix(in srgb, var(--type, #F2B33D) 70%, #fff));color:#fff}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-he);font-weight:700;font-size:14px}
.chip-s{font-family:var(--f-he);font-weight:600;font-size:12px;background:rgba(255,255,255,.25);padding:3px 9px;border-radius:999px}
.stage-in{flex:0 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;padding:16px 18px 16px}
.stage-in.center{justify-content:center}
.swap{animation:swapin .24s cubic-bezier(.2,.8,.3,1)}
@keyframes swapin{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.prompt{font-family:var(--f-he);font-weight:700;font-size:20px;line-height:1.3;margin:0;text-wrap:balance}
.sub{font-size:13.5px;color:var(--muted);line-height:1.45;margin:0}
.word{font-family:var(--f-en);font-weight:800;font-size:44px;line-height:1.02;letter-spacing:-.5px;margin:0;direction:ltr;text-align:left}
.stress{font-family:var(--f-en);font-size:15px;color:var(--muted);direction:ltr;text-align:left}
.stress b{color:var(--listen);font-weight:800}
.mean{font-family:var(--f-he);font-weight:700;font-size:22px;line-height:1.3;margin:0}
.sent{font-family:var(--f-en);font-size:19px;line-height:1.5;direction:ltr;text-align:left;margin:0}
.sent mark{background:linear-gradient(transparent 62%, color-mix(in srgb, var(--type, #F2B33D) 40%, transparent) 0);color:inherit;font-weight:800;padding:0 2px}
.ltr-row{display:flex;align-items:center;justify-content:space-between;gap:12px;direction:ltr}
.audio{display:flex;gap:8px;direction:ltr;flex:none}
.play{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.play.slow{background:var(--paper2);color:var(--ink);font-family:var(--f-en);font-weight:800;font-size:13px}
.pic{width:96px;height:96px;border-radius:26px;background:color-mix(in srgb, var(--type) 18%, #fff);display:flex;align-items:center;justify-content:center;flex:none;animation:float 4s ease-in-out infinite}
.pic svg{width:72px;height:72px}
@keyframes float{50%{transform:translateY(-4px) rotate(-2deg)}}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.dtag{font-family:var(--f-he);font-weight:600;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--paper2);color:var(--muted)}
.dtag.lv{font-family:var(--f-en);direction:ltr}
.wave-card{display:flex;align-items:center;gap:14px;background:var(--ink);border-radius:22px;padding:14px;direction:ltr;box-shadow:0 10px 24px rgba(34,23,47,.25)}
.wave-play{width:62px;height:62px;border-radius:50%;background:var(--listen);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 0 rgba(255,122,89,.5)}
.wave-card.playing .wave-play{animation:ring 1.1s ease-out infinite}
@keyframes ring{to{box-shadow:0 0 0 14px rgba(255,122,89,0)}}
.wave{flex:1;height:56px;display:flex;align-items:center;gap:3px}
.wave i{flex:1;border-radius:3px;background:rgba(255,247,234,.28);height:calc(var(--h) * 1%)}
.wave-card.playing .wave i{background:var(--listen);animation:wv .55s ease-in-out infinite alternate;animation-delay:calc(var(--d) * 1s)}
@keyframes wv{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.wave-slow{width:42px;height:42px;border-radius:12px;background:rgba(255,247,234,.12);color:var(--paper);font-family:var(--f-en);font-weight:800;font-size:12.5px;flex:none}
.reveal-word{min-height:52px;display:flex;align-items:center;justify-content:center;direction:ltr}
.reveal-word .q{font-family:var(--f-en);font-weight:800;font-size:30px;letter-spacing:8px;color:var(--soft)}
.reveal-word .w{font-family:var(--f-en);font-weight:800;font-size:34px;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.gap-sent{font-family:var(--f-en);font-size:24px;line-height:1.7;direction:ltr;text-align:left;margin:0}
.slot{display:inline-block;vertical-align:baseline;min-width:3.6em;padding:0 8px;margin:0 2px;border-radius:10px;border:2.5px dashed var(--gap);background:rgba(242,179,61,.1);color:transparent;line-height:1.35;transition:background .15s,border-color .15s}
.slot.hover{background:rgba(242,179,61,.3)}
.slot.filled{border-style:solid;color:var(--ink);font-weight:800}
.slot.ok{border-color:var(--ok);background:var(--okbg);color:var(--okink)}
.slot.bad{border-color:var(--bad);background:var(--badbg);color:var(--badink);text-decoration:line-through}
.slot.land{animation:land .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{0%{transform:scale(1.3)}100%{transform:none}}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;direction:ltr}
.tile{min-height:56px;padding:8px 18px;border-radius:16px;background:var(--paper);color:var(--ink);font-family:var(--f-en);font-weight:800;font-size:18px;box-shadow:0 5px 0 #C9B9A0;touch-action:none}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 #C9B9A0}
.tile.ghost{opacity:.25}
.tile.drag{position:fixed;z-index:50;pointer-events:none;box-shadow:0 14px 30px rgba(0,0,0,.4);transform:rotate(-3deg) scale(1.05)}
.tray-hint{text-align:center;color:var(--soft);font-family:var(--f-he);font-size:13px;margin:0}
.flip{flex:1;min-height:300px;perspective:1200px;display:flex}
.flip-in{position:relative;flex:1;min-height:300px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.8,.3,1)}
.flip.done .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:12px;box-sizing:border-box;overflow:auto}
.face.front{background:linear-gradient(160deg,#EFEAFF,#DCD2FF);box-shadow:inset 0 0 0 2px #CFC4FF}
.face.back{background:#fff;box-shadow:inset 0 0 0 2px #CFC4FF;transform:rotateY(180deg)}
.blank-line{display:inline-block;min-width:4.2em;border-bottom:3px dashed var(--recall)}
.hint{font-family:var(--f-he);font-weight:600;font-size:14px;color:#5A47D6}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;position:relative}
.mcol{display:flex;flex-direction:column;gap:10px}
.mt{min-height:64px;border-radius:16px;background:#fff;color:var(--ink);padding:8px 10px;box-shadow:0 4px 0 #D8C9AF;display:flex;align-items:center;justify-content:center;text-align:center;transition:transform .12s,background .15s,opacity .25s;touch-action:none}
.mt.en-t{font-family:var(--f-en);font-weight:800;font-size:17px;direction:ltr}
.mt.he-t{font-family:var(--f-he);font-weight:600;font-size:14.5px;line-height:1.25}
.mt.snd{background:var(--ink);color:var(--gold)}
.mt.sel{background:#FFE6F1;box-shadow:0 0 0 3px var(--match), 0 4px 0 #D8C9AF;transform:translateY(-2px)}
.mt.done,.mt.snd.done{background:var(--okbg);color:var(--okink);box-shadow:none;opacity:.8;pointer-events:none;animation:pop .3s}
.mt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.match-svg{position:absolute;inset:0;pointer-events:none;overflow:visible}
.scene{position:relative;width:100%;border-radius:18px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.25);background:#2a2030}
.scene img{display:block;width:100%;height:auto}
.hs{position:absolute;border-radius:14px;background:transparent;transition:box-shadow .2s, background .2s}
.hs:active{background:rgba(255,255,255,.12)}
.hs.ok{box-shadow:0 0 0 3px var(--ok), 0 0 24px 4px rgba(31,169,120,.6);background:rgba(31,169,120,.12)}
.hs.no{box-shadow:0 0 0 3px var(--bad);background:rgba(229,72,90,.12)}
.cap{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(27,18,48,.9);color:var(--paper);border-radius:14px;padding:8px 11px;font-size:14px;line-height:1.4;backdrop-filter:blur(6px);animation:swapin .2s}
.cap > .en{display:block;font-size:16px;font-style:italic}
.cap bdi.en{display:inline;font-weight:700}
.found{display:flex;gap:6px;justify-content:center}
.found i{width:14px;height:14px;border-radius:50%;border:2px solid var(--scene);box-sizing:border-box}
.found i.on{background:var(--scene)}
.fb{border-radius:18px;padding:11px 13px;font-size:14.5px;line-height:1.45;display:flex;gap:10px;align-items:flex-start;animation:fbin .26s cubic-bezier(.2,.8,.3,1)}
@keyframes fbin{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.fb.ok{background:var(--okbg);color:var(--okink);box-shadow:inset 0 0 0 2px rgba(31,169,120,.35)}
.fb.bad{background:var(--badbg);color:var(--badink);box-shadow:inset 0 0 0 2px rgba(229,72,90,.3)}
.fb.info{background:#EEE9FF;color:#3B2F8A}
.fb .mark{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.fb.ok .mark{background:var(--ok)}.fb.bad .mark{background:var(--bad)}.fb.info .mark{background:var(--recall)}
.fb .body{flex:1;min-width:0}
.fb .head{font-family:var(--f-he);font-weight:700;font-size:15.5px}
.fb .w{display:block;font-family:var(--f-en);font-weight:800;font-size:18px;direction:ltr;text-align:right}
.diff{margin-top:6px;padding-top:6px;border-top:1px dashed currentColor;font-size:14px}
.diff .row{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.diff .en{font-weight:800}
.burst{position:fixed;z-index:60;pointer-events:none;width:9px;height:9px;border-radius:2px}
.flychip{position:fixed;z-index:60;pointer-events:none;font-family:var(--f-en);font-weight:800;font-size:15px;padding:4px 10px;border-radius:999px;background:var(--gold);color:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.3)}
.actions{display:flex;flex-direction:column;gap:9px;min-height:0}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{min-height:54px;border-radius:16px;background:var(--paper);color:var(--ink);padding:9px 14px;font-family:var(--f-he);font-weight:600;font-size:16px;line-height:1.25;box-shadow:0 4px 0 #C9B9A0;transition:transform .08s, background .15s, opacity .2s;text-align:right;display:flex;align-items:center;gap:10px}
.opt .n{flex:none;width:26px;height:26px;border-radius:8px;background:var(--paper2);color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:center;font-family:var(--f-body)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #C9B9A0}
.opt.ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 #147A55;animation:pop .3s}
.opt.bad{background:var(--bad);color:#fff;box-shadow:0 4px 0 #9E2635;animation:shake .35s}
.opt.ok .n,.opt.bad .n{background:rgba(255,255,255,.25);color:#fff}
.opt.dim{opacity:.4}
.opt[disabled]{cursor:default}
.primary{min-height:58px;border-radius:18px;background:linear-gradient(180deg,#FFE29A,#F2B33D);color:var(--ink);font-family:var(--f-he);font-weight:700;font-size:20px;box-shadow:0 5px 0 #B98A2B;display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity .2s}
.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #B98A2B}
.primary[disabled]{opacity:.75}
.ghost{min-height:52px;border-radius:16px;background:rgba(255,247,234,.1);color:var(--paper);font-family:var(--f-he);font-weight:600;font-size:16px}
.pair2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.rate .opt{justify-content:center;text-align:center}
.honest{font-size:12px;color:var(--soft);text-align:center;margin:0}
.kbd{opacity:.5;font-size:12px;font-family:var(--f-body)}

/* ---------- end ---------- */
.end-hero{text-align:center}
.hero-title{font-family:var(--f-en);font-weight:800;font-size:44px;letter-spacing:-1px;line-height:1;margin:0;direction:ltr}
.hero-title i{color:var(--listen)}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.legend div{background:var(--paper2);border-radius:16px;padding:10px 6px;text-align:center}
.legend b{display:block;font-family:var(--f-he);font-size:24px;line-height:1.1}
.legend span{font-size:12.5px;color:var(--muted)}
.unlock,.ach{display:flex;gap:10px;align-items:center;border-radius:16px;padding:10px 12px;background:linear-gradient(90deg,#FFF1C9,#FFE29A);color:#6A4A00;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.unlock b,.ach b{display:block;font-family:var(--f-he)}.unlock span,.ach span{font-size:13px}
.achs{display:flex;flex-direction:column;gap:8px}
.medal{width:36px;height:36px;border-radius:50%;background:#F2B33D;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 3px #fff, 0 4px 10px rgba(0,0,0,.2)}
.lbl{margin-bottom:6px}
.lineup{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.chip{font-family:var(--f-en);font-weight:600;font-size:14px;padding:4px 10px;border-radius:999px;background:var(--paper2);color:var(--ink)}
.chip.new{background:#E1F6F7;color:#0F6A70}.chip.shaky{background:#FFF0D6;color:#8A5A00}.chip.lost{background:var(--badbg);color:var(--badink)}
.honest-s{font-size:12px;color:var(--muted);margin:0}

/* ---------- settings sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:80;background:rgba(10,6,20,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;max-height:88%;overflow:auto;box-sizing:border-box;background:var(--paper);color:var(--ink);border-radius:24px 24px 0 0;padding:16px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:12px;animation:up .26s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(40px)}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;font-family:var(--f-he);font-size:18px}
.row-s{display:flex;gap:10px;align-items:flex-start}
.row-s p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.row-s .sync{background:var(--paper2);padding:0 8px;height:28px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbtn{min-height:48px;border-radius:14px;background:var(--paper2);color:var(--ink);font-family:var(--f-he);font-weight:600;font-size:14.5px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 8px;cursor:pointer}
.sbtn.danger{background:var(--badbg);color:var(--badink)}
.test{border:1px dashed var(--soft);border-radius:14px;padding:10px}
.test p{margin:2px 0 8px;font-size:13px;color:var(--muted)}
.sheetmsg{font-size:14px;color:var(--ink)}
.sheetmsg textarea{width:100%;box-sizing:border-box;font-size:11px;direction:ltr}

/* ---------- M2: home ---------- */
.home{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;margin:0 -14px;padding:0 14px 28px;scroll-behavior:smooth}
.lights{position:absolute;top:8px;left:12%;right:12%;display:flex;justify-content:space-between;z-index:2}
.lights i{width:8px;height:8px;border-radius:50%;background:#FFE7A8;box-shadow:0 0 10px #FFD27A;animation:bulb 1.6s ease-in-out infinite;animation-delay:calc(var(--i) * .18s)}
@keyframes bulb{50%{opacity:.35;box-shadow:none}}
.hero-stats{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:4}
.hero-stats>div{background:rgba(20,10,30,.62);backdrop-filter:blur(6px);border:1px solid rgba(255,210,122,.25);border-radius:12px;padding:5px 9px;text-align:center}
.hero-stats b{display:block;font-family:var(--f-he);font-size:18px;line-height:1.05;color:var(--gold)}
.hero-stats span{font-size:10.5px;color:var(--soft)}
.hero-stats .wk{display:flex;flex-wrap:wrap;gap:3px;width:70px;justify-content:center;align-content:center}
.hero-stats .wk i{width:7px;height:7px;border-radius:2px;background:rgba(255,247,234,.18)}
.hero-stats .wk i.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.hero-stats .wk span{flex-basis:100%}
.note b{color:var(--paper)}
.sec-t{display:flex;align-items:center;gap:6px}
.sec-t svg{width:16px;height:16px}
.sec-t span{margin-inline-start:auto;font-size:12px;color:var(--soft)}
.medals{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.medals::-webkit-scrollbar{display:none}
.medal-i{flex:0 0 96px;border-radius:16px;padding:10px 8px;text-align:center;background:rgba(255,247,234,.05);border:1px dashed rgba(255,247,234,.18);display:flex;flex-direction:column;align-items:center;gap:3px}
.medal-i .m{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,247,234,.08);color:var(--soft)}
.medal-i .m svg{width:20px;height:20px}
.medal-i b{font-family:var(--f-he);font-size:12.5px;line-height:1.2}
.medal-i small{font-size:10.5px;color:var(--soft);line-height:1.25}
.medal-i.got{background:linear-gradient(170deg,rgba(255,210,122,.22),rgba(255,122,89,.08));border:1px solid rgba(255,210,122,.45)}
.medal-i.got .m{background:radial-gradient(circle at 35% 30%,#FFF1C4,#F2B33D 60%,#B98A2B);color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.15),0 6px 14px rgba(242,179,61,.4)}
.district{position:relative;border-radius:26px;padding:12px 12px 6px;margin-bottom:6px;background:
  radial-gradient(80% 60% at 80% 20%, color-mix(in srgb, var(--c) 30%, transparent), transparent 70%),
  radial-gradient(70% 60% at 10% 90%, color-mix(in srgb, var(--c) 20%, transparent), transparent 70%),
  linear-gradient(180deg,#2A1A46,#21143A);border:1px solid color-mix(in srgb, var(--c) 40%, transparent)}
.district.dim{filter:saturate(.35) brightness(.8)}
.banner{display:flex;align-items:center;gap:10px}
.banner b{display:block;font-family:var(--f-he);font-size:18px}
.banner span{font-size:12.5px;color:var(--soft)}
.medal-c{width:44px;height:44px;flex:none;border-radius:14px;background:linear-gradient(160deg,var(--c),color-mix(in srgb, var(--c) 55%, #1B1230));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px color-mix(in srgb, var(--c) 45%, transparent);transform:rotate(-6deg)}
.medal-c svg{width:24px;height:24px}
.banner .cnt{margin-inline-start:auto;font-family:var(--f-he);font-weight:700;font-size:14px;color:var(--c);background:rgba(0,0,0,.25);padding:3px 9px;border-radius:999px}
.path{position:relative;height:300px;margin-top:34px}
.trail{position:absolute;inset:6px 0 0;width:100%;height:100%}
.trail path{fill:none;stroke:color-mix(in srgb, var(--c) 70%, #fff);stroke-width:5;stroke-linecap:round;stroke-dasharray:2 14;opacity:.55}
.mnode{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;width:120px;padding:0;background:none}
.mnode.p-r{right:7%;top:6px}.mnode.p-c{left:50%;margin-left:-60px;top:104px}.mnode.p-l{left:7%;top:202px}
.tok{position:relative;width:70px;height:70px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%), rgba(255,247,234,.12) 0);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 rgba(0,0,0,.28)}
.tok-in{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-he);font-weight:700;font-size:22px;color:#fff;background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 60%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 60%, #000))}
.tok-in svg{width:24px;height:24px}
.mnode.locked .tok{background:rgba(255,247,234,.08)}
.mnode.locked .tok-in{background:#2E2245;color:var(--soft)}
.mnode.done .tok{background:conic-gradient(#FFD27A 100%, transparent 0)}
.mnode.done .tok-in{background:radial-gradient(circle at 35% 30%,#FFF1C4,#F2B33D 60%,#B98A2B);color:#fff}
.mnode.cur .tok{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 8px 0 rgba(0,0,0,.28),0 0 0 10px color-mix(in srgb, var(--c) 25%, transparent)}}
.mlabel{font-family:var(--f-he);font-weight:600;font-size:13px;line-height:1.2;color:var(--paper);text-align:center;background:rgba(20,10,30,.55);padding:3px 8px;border-radius:10px}
.mlabel small{display:block;font-size:11px;color:var(--c);font-weight:700}
.mnode.locked .mlabel{color:var(--soft)}
.pin{position:absolute;top:-34px;z-index:2;width:38px;height:38px;animation:pinbob 1.6s ease-in-out infinite}
.pin svg{width:38px;height:38px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
@keyframes pinbob{50%{transform:translateY(-5px)}}
.lock-note{display:flex;align-items:center;gap:5px;justify-content:center;font-size:12.5px;color:var(--soft);margin:2px 0 6px}
.soon-card{display:flex;gap:10px;align-items:center;border-radius:20px;padding:14px;border:1px dashed rgba(255,210,122,.4);color:var(--soft)}
.soon-card svg{width:28px;height:28px;color:var(--gold)}
.soon-card b{display:block;font-family:var(--f-he);color:var(--paper)}
.peek-sub{margin:0;font-size:13.5px;color:var(--muted)}
.peek-list{display:flex;flex-direction:column;gap:6px}
.pw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto;gap:8px;align-items:center;background:var(--paper2);border-radius:12px;padding:8px 10px}
.pw .en{font-weight:800;font-size:15px;text-align:left}
.pw .he{font-size:13px;color:var(--ink)}
.pw.hid .en{filter:blur(4px)}
.pw.hid .he{color:var(--muted)}
.lvl{display:flex;gap:3px}
.lvl i{width:8px;height:8px;border-radius:50%;background:rgba(34,23,47,.15)}
.lvl i.on{background:var(--c, var(--gold))}

/* ---------- M2: session set pieces ---------- */
.track .ms{position:absolute;top:50%;left:var(--at);width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,247,234,.55)}
.combo{display:none;align-items:center;gap:2px;background:rgba(255,122,89,.18);border:1px solid rgba(255,122,89,.45);padding:3px 8px 3px 6px;border-radius:999px}
.combo.on{display:inline-flex}
.stage{transition:box-shadow .3s}
.stamp-layer{position:absolute;top:2px;left:10px;pointer-events:none;z-index:5}
.stampmark{font-family:var(--f-he);font-weight:700;font-size:17px;padding:2px 12px;border-radius:12px;border:3px solid currentColor;transform:rotate(-12deg);background:rgba(255,255,255,.85);animation:stampin .45s cubic-bezier(.3,1.6,.5,1) both, stampout .4s ease-in 1.5s forwards}
.stampmark.ok{color:var(--ok)}.stampmark.bad{color:var(--bad)}.stampmark.mid{color:#B98A2B}
@keyframes stampin{from{transform:rotate(-30deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
@keyframes stampout{to{opacity:0;transform:rotate(-12deg) scale(.9)}}
.drop i{display:inline-block;font-style:normal;animation:dropin .42s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i) * 35ms)}
@keyframes dropin{from{transform:translateY(-22px) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.intro-top{display:flex;align-items:center;justify-content:space-between;direction:ltr}
.ribbon{font-family:var(--f-en);font-weight:800;font-size:13px;letter-spacing:2px;color:#fff;background:var(--intro);padding:4px 12px;border-radius:999px;box-shadow:0 4px 12px rgba(63,193,201,.45);transform:rotate(-4deg)}
.type-pic span{font-weight:800;font-size:15px;color:var(--ink);opacity:.6}
.tiles{display:flex;flex-direction:column;gap:9px}
.tiles.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.gtile{position:relative;min-height:62px;border-radius:18px;background:#fff;color:var(--ink);padding:10px 12px 12px;font-family:var(--f-he);font-weight:600;font-size:16px;line-height:1.25;display:flex;align-items:center;gap:10px;text-align:right;box-shadow:0 5px 0 var(--tc),0 8px 18px rgba(0,0,0,.25);border:2px solid color-mix(in srgb, var(--tc) 35%, transparent);transition:transform .1s, background .15s, opacity .2s}
.tiles.grid .gtile{flex-direction:column;justify-content:center;text-align:center;min-height:84px;gap:6px}
.en-tiles .gtile .tt{font-family:var(--f-en);font-weight:800;font-size:17px;direction:ltr}
.gtile .shape{width:24px;height:24px;flex:none;color:var(--tc)}
.gtile .shape svg{width:100%;height:100%;display:block}
.gtile.c0{--tc:#FF7A59}.gtile.c1{--tc:#5B8CFF}.gtile.c2{--tc:#F2B33D}.gtile.c3{--tc:#4FB06B}
.gtile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--tc)}
.gtile.ok{background:var(--ok);color:#fff;border-color:var(--ok);box-shadow:0 5px 0 #147A55,0 0 0 4px rgba(31,169,120,.25);animation:win .5s cubic-bezier(.3,1.6,.5,1)}
.gtile.ok .shape{color:#fff}
.gtile.bad{background:var(--bad);color:#fff;border-color:var(--bad);box-shadow:0 5px 0 #9E2635;animation:shake .35s}
.gtile.bad .shape{color:#fff}
.gtile.dim{opacity:.35;transform:scale(.96)}
@keyframes win{40%{transform:scale(1.06) rotate(-1deg)}}
.marquee{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;direction:ltr;border-radius:18px;padding:18px 14px;background:linear-gradient(180deg,#2A1640,#1B1230);color:#FFE7A8;box-shadow:inset 0 0 0 3px #B98A2B, 0 10px 22px rgba(0,0,0,.25)}
.bulbs{position:absolute;inset:5px;border-radius:14px;pointer-events:none;background:
  radial-gradient(circle, #FFE7A8 2px, transparent 2.6px) 0 0/16px 100% repeat-x,
  radial-gradient(circle, #FFE7A8 2px, transparent 2.6px) 0 100%/16px 8px repeat-x;animation:marq 1.2s linear infinite;opacity:.9}
@keyframes marq{to{background-position:16px 0, -16px 100%}}
.word.mq{color:#FFE7A8;text-shadow:0 0 18px rgba(255,210,122,.55);text-align:center}
.mini-play{width:40px;height:40px;border-radius:50%;background:rgba(255,231,168,.15);color:#FFE7A8;display:flex;align-items:center;justify-content:center;flex:none}
.sent.dim{color:var(--muted)}
.bubble-q{display:flex;align-items:flex-end;gap:8px}
.bubble-q .who svg{width:52px;height:52px;display:block}
.bubble-q p{flex:1;margin:0;background:linear-gradient(160deg,#E4F8F6,#C9F0EB);border-radius:20px 20px 20px 4px;padding:14px 16px;font-family:var(--f-he);font-weight:700;font-size:22px;line-height:1.3;color:#0E4B45;box-shadow:inset 0 0 0 2px rgba(46,196,182,.35)}
.orb-wrap{position:relative;border-radius:22px;background:radial-gradient(70% 90% at 50% 50%,#2E1C4D,#1B1230);height:170px;overflow:hidden;box-shadow:0 10px 24px rgba(34,23,47,.25)}
.orb-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.orb-play{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border-radius:50%;background:var(--listen);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(255,122,89,.18),0 10px 20px rgba(0,0,0,.35)}
.orb-wrap.playing .orb-play{animation:ring 1.1s ease-out infinite}
.orb-slow{position:absolute;right:10px;bottom:10px;height:34px;padding:0 10px;border-radius:10px;background:rgba(255,247,234,.12);color:var(--paper);font-family:var(--f-en);font-weight:800;font-size:12.5px}
.ticket{position:relative;padding:18px 18px;border-radius:14px;background:linear-gradient(180deg,#FFFDF6,#FFF3D9);box-shadow:0 8px 20px rgba(185,138,43,.2), inset 0 0 0 2px rgba(242,179,61,.35);
  -webkit-mask:radial-gradient(circle 9px at 0 50%, transparent 98%, #000) , radial-gradient(circle 9px at 100% 50%, transparent 98%, #000);-webkit-mask-composite:source-in;mask-composite:intersect;transition:transform .2s}
.ticket::after{content:"";position:absolute;top:8px;bottom:8px;right:26px;border-right:2px dashed rgba(242,179,61,.5)}
.ticket.won{animation:win .5s cubic-bezier(.3,1.6,.5,1);box-shadow:0 8px 24px rgba(31,169,120,.35), inset 0 0 0 2px rgba(31,169,120,.5)}
.ticket.lost{animation:shake .35s}
.tile.key{position:relative;background:linear-gradient(180deg,#FFFFFF,#F1E6D2);border:1px solid #E2D2B6;box-shadow:0 6px 0 #C9B496, 0 10px 16px rgba(0,0,0,.25), inset 0 2px 0 #fff}
.tile.key:active{transform:translateY(4px);box-shadow:0 2px 0 #C9B496, inset 0 2px 0 #fff}
.face.back.holo{background:linear-gradient(115deg,#FFFFFF 20%,#EDE7FF 35%,#E2F7F4 50%,#FFF0E2 65%,#FFFFFF 80%);background-size:300% 100%;animation:holo 4s linear infinite}
@keyframes holo{to{background-position:-300% 0}}
.tapme{align-self:center;font-family:var(--f-he);font-size:12.5px;color:#5A47D6;background:rgba(143,124,255,.15);padding:4px 10px;border-radius:999px;animation:pinbob 1.8s ease-in-out infinite}
.face.front{cursor:pointer}
.stage.end{overflow:hidden}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;left:calc(var(--i) * 7.3%);width:8px;height:12px;border-radius:2px;background:hsl(calc(var(--i) * 37), 85%, 62%);animation:fall 2.6s ease-in calc(var(--i) * .12s) both}
@keyframes fall{to{transform:translateY(560px) rotate(540deg);opacity:0}}
.mt.en-t,.mt.he-t{border:2px solid rgba(232,93,156,.18)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ===== M3 ===== */
#app{--world:var(--gold)}
#app:has(.stage-wrap){background:radial-gradient(120% 60% at 50% -10%, color-mix(in srgb, var(--world) 26%, transparent), transparent 70%), var(--bg, #1A1226)}
.stars{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px;border-radius:999px;background:rgba(255,210,122,.14);color:var(--gold);font-weight:800;font-size:14px}
.stars svg{width:16px;height:16px}
.stars.dark{background:var(--ink);color:var(--gold)}
.hbar-r{gap:6px}
.hbar-r .icon-btn{width:36px;height:36px}
.weak-btn{margin-top:10px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:16px;background:linear-gradient(135deg,#8F7CFF,#5B8CFF);color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .12s}
.weak-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.weak-btn b{background:rgba(255,255,255,.22);border-radius:999px;padding:1px 9px}
.quests{display:flex;flex-direction:column;gap:8px}
.quests .sec-t span{margin-inline-start:auto;font-size:13px;opacity:.8}
.quest{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:rgba(255,247,234,.06);border:1px solid rgba(255,247,234,.08)}
.quest .qi{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(255,210,122,.15);color:var(--gold);flex:none}
.quest.done .qi{background:#3DDC97;color:#14301f}
.quest .qt{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.quest .qt b{font-size:14px;font-weight:700}
.qbar{height:6px;border-radius:6px;background:rgba(255,247,234,.1);overflow:hidden}
.qbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),#FF7A59);transition:width .6s}
.quest.done .qbar i{background:#3DDC97}
.qr{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--gold);white-space:nowrap}
.qr svg{width:13px;height:13px}
.season{position:relative;margin-top:6px}
.season-h{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 12px;margin:4px 0 12px;border-radius:18px;background:linear-gradient(135deg, color-mix(in srgb, var(--sc) 40%, transparent), rgba(255,247,234,.04));border:1px solid color-mix(in srgb, var(--sc) 50%, transparent);text-align:center}
.season-h b{font-size:20px;font-weight:900;letter-spacing:.5px;color:var(--sc)}
.season-h span{font-size:13px;opacity:.85}
.skyline{display:block;width:100%;height:46px;margin-top:8px;opacity:.9}
.skyline{fill:color-mix(in srgb, var(--c, var(--gold)) 35%, #1A1226)}
.skyline .win{fill:var(--gold);opacity:.7;animation:twinkle 3s infinite alternate}
.skyline .beam{fill:var(--c, var(--gold));opacity:.25}
@keyframes twinkle{to{opacity:.25}}
.stage-wrap{position:relative}
.peeker{position:fixed;left:-10px;top:38%;width:64px;height:64px;pointer-events:none;transform:translateX(-120%) rotate(-20deg);transition:transform .3s cubic-bezier(.2,1.4,.4,1);z-index:30;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.peeker.on{transform:translateX(0) rotate(12deg)}
.peeker svg{width:100%;height:100%}
.pk-fx{position:absolute;top:-6px;inset-inline-end:-6px;font-size:22px;font-weight:900;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.peeker.oops .pk-fx{color:#FF8A8A}
.gtile,.tile.key,.opt,.primary,.go,.mt,.ghost{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .52s ease-out forwards}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
.head-r{display:inline-flex;align-items:center;gap:6px;min-width:0}
.world-chip{display:inline-flex;align-items:center;gap:4px;max-width:150px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;height:26px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb, var(--world) 22%, transparent);color:var(--world);border:1px solid color-mix(in srgb, var(--world) 45%, transparent)}
.world-chip svg{width:14px;height:14px;flex:none}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.fchip{flex:none;height:36px;padding:0 12px;border-radius:999px;background:rgba(255,247,234,.08);color:var(--paper);font-weight:700;font-size:13.5px}
.fchip b{opacity:.7;margin-inline-start:2px}
.fchip.on{background:var(--gold);color:var(--ink)}
.bank{display:flex;flex-direction:column;gap:8px}
.bw{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:var(--paper);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.bw .play{width:40px;height:40px}
.bt{flex:1;display:flex;flex-direction:column;min-width:0}
.bt .en{direction:ltr;text-align:right;font-weight:800;font-size:16px}
.bt .he{font-size:13px;color:var(--muted)}
.wr-top{display:flex;align-items:center;gap:14px}
.wr-fig{width:96px;height:110px;flex:none}
.wr-fig svg{width:100%;height:100%}
.wr-top>div{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.wr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wr{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:16px;background:var(--paper2);color:var(--ink);border:2px solid transparent;min-height:84px}
.wr.on{border-color:var(--gold);background:#FFF1D0}
.wr.locked{opacity:.75}
.wr .sw{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.wr b{font-size:13.5px}
.wr small{font-size:12px;color:var(--muted)}
.gain{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:18px;background:linear-gradient(135deg,#FFE3A3,#FFC86B);color:#7A3E00;font-weight:800;box-shadow:0 3px 0 rgba(122,62,0,.25)}
.gain b{font-size:28px;font-variant-numeric:tabular-nums}
.gain em{flex-basis:100%;text-align:center;font-style:normal;font-size:13px;color:#7A3E00;opacity:.9;font-weight:600}
.bw .lvl i.on{background:#FF7A59}
.gstar svg{width:26px;height:26px;animation:spin 1.2s ease-out}
@keyframes spin{from{transform:rotate(-180deg) scale(.3)}to{transform:none}}

/* =====================================================================
   M4 · Golden-hour Isles. One restrained palette: deep sea teal, dusk, ivory, gold.
   Ivory enamel for things you touch, deep glass for things you read about, gold only for success and reward.
   ===================================================================== */
:root{
  --bg:#0F2A36; --bg2:#17404C; --paper:#FBF4E8; --paper2:#F1E4CF; --ink:#1C2230; --muted:#6E6A70; --soft:#B9CCCF;
  --listen:#E0795E; --gap:#E8B44C; --recall:#5E9E95; --intro:#E8B44C; --match:#E0795E; --scene:#5E9E95; --pick:#E8B44C; --reverse:#5E9E95;
  --ok:#C98F1E; --okbg:#FFF3D6; --okink:#5A3B00; --bad:#C9566A; --badbg:#F7E5E5; --badink:#6E2B36; --gold:#F6C35B; --gold2:#E8B44C;
  --teal:#1F5C66; --teal2:#2C7A80; --coral:#E0795E; --coral2:#C95B42; --glass:rgba(12,34,44,.62);
  --f-he:"Rubik",system-ui,sans-serif; --f-body:"Rubik",system-ui,sans-serif; --f-en:"Rubik",system-ui,sans-serif; --f-disp:"Syne","Rubik",sans-serif;
}
body{background:#0F2A36;font-weight:500}
body::before{background:
  radial-gradient(70% 40% at 72% 78%, rgba(246,195,91,.28), transparent 70%),
  radial-gradient(60% 40% at 15% 30%, rgba(127,184,174,.12), transparent 70%),
  linear-gradient(180deg,#0E2833 0%,#194654 38%,#7E6B66 72%,#D99474 100%)}
#app{z-index:1}
#app:has(.stage-wrap){background:none}
.word,.reveal-word .w,.fb .w,.hero-title,.reveal-word .q{font-family:var(--f-disp)!important;letter-spacing:-.01em}
.sent,.gap-sent,.stress,.cap>.en,.chip,.mt.en-t,.tile,.en-tiles .gtile .tt,.pw .en,.bt .en{font-family:var(--f-body)}
.sent{font-size:18px;font-weight:500;color:#2A3040}
.sent mark{background:linear-gradient(transparent 60%, rgba(246,195,91,.55) 0);font-weight:700}
.prompt{font-weight:800;font-size:19px;color:var(--ink)}
.mean{font-weight:800}
.margo .f-k{display:none}.margo[data-face="k"] .f-n{display:none}.margo[data-face="k"] .f-k{display:inline}
.margo.m4 .blink{transform-box:fill-box;transform-origin:center;animation:mblink 5s infinite}
@keyframes mblink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.margo.m4 .tail{transform-box:view-box;transform-origin:118px 164px;animation:mtail 2.8s ease-in-out infinite}
@keyframes mtail{50%{transform:rotate(6deg)}}
.margo.m4 .bodyg{transform-box:view-box;transform-origin:100px 262px;animation:mbreath 3.6s ease-in-out infinite}
@keyframes mbreath{50%{transform:scale(1.012,.988)}}
.margo.m4 .headg{transform-box:view-box;transform-origin:100px 132px;animation:mhead 5.5s ease-in-out infinite}
@keyframes mhead{30%{transform:rotate(-3deg)}60%{transform:rotate(1.5deg)}}

/* ---------- session frame ---------- */
.top4{display:flex;align-items:center;gap:10px;min-height:46px;position:relative;z-index:8}
.x4{width:40px;height:40px;border-radius:14px;background:var(--glass);color:var(--paper);font-size:15px;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.track4{flex:1;height:10px;border-radius:999px;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 2px rgba(0,0,0,.3);overflow:hidden}
.track4 .fill{background:linear-gradient(90deg,#E8B44C,#F6C35B,#FFE3A6);box-shadow:0 0 12px rgba(246,195,91,.6)}
.pill4{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 11px 0 12px;border-radius:999px;background:var(--glass);color:var(--paper);font-weight:800;font-size:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.14);font-variant-numeric:tabular-nums}
.pill4 svg{width:18px;height:18px;color:var(--gold)}
.pill4.bump{animation:bump .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{50%{transform:scale(1.22)}}
.combo{background:rgba(246,195,91,.16);border-color:rgba(246,195,91,.45);color:var(--gold)}
.stage-wrap{align-items:flex-start;padding-top:64px;box-sizing:border-box}
.lean{position:absolute;top:-2px;left:0;width:94px;height:118px;z-index:7;padding:0;border-radius:0;background:none!important}
.lean svg,.host.lean svg{width:94px!important;height:118px!important;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.lean.jump{animation:mjump .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes mjump{35%{transform:translateY(-12px) rotate(-4deg)}70%{transform:translateY(1px)}}
.lean.droop{animation:mdroop .7s ease}
@keyframes mdroop{30%{transform:translateY(5px) rotate(4deg)}60%{transform:translateY(3px) rotate(-2deg)}}
.stage-wrap .quip{top:6px;left:98px;right:auto;max-width:calc(100% - 108px);border-radius:16px 16px 16px 4px;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-weight:600;font-size:13.5px;box-shadow:0 10px 24px -8px rgba(0,0,0,.5)}
.stage{background:#FBF5EA;background-image:linear-gradient(180deg,#FFFBF3,#F7EEDF);border-radius:28px;
  box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(232,180,76,.35),0 7px 0 #D8C19D,0 26px 40px -14px rgba(0,0,0,.6)}
.stage-head{background:none;color:var(--ink);justify-content:flex-start;padding:14px 16px 2px}
.badge{font-size:12.5px;font-weight:800;background:var(--ink);color:var(--gold);padding:5px 12px 5px 10px;border-radius:999px;letter-spacing:.01em}
.badge svg{width:15px;height:15px}
.chip-s{background:var(--paper2);color:#6B5A3E;font-weight:700}
.stage-in{padding:12px 18px 18px}
.stage-in.swap{animation:none}
.stage.enter{animation:cardIn .42s cubic-bezier(.2,1.1,.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateX(-46px) rotate(-2.5deg) scale(.97)}}
.stage.leave{transition:transform .17s ease-in,opacity .17s ease-in;transform:translateX(70px) rotate(3deg);opacity:0}
.actions{transition:opacity .15s}
.actions.leave{opacity:0}
.actions .tiles,.actions .tray,.actions .rate,.actions .pair2,.actions .primary{animation:actIn .36s .06s cubic-bezier(.2,1,.3,1) both}
@keyframes actIn{from{opacity:0;transform:translateY(14px)}}
.stampmark{font-family:var(--f-body);font-weight:900;font-size:15px;border-width:2px;background:var(--paper);padding:2px 12px;box-shadow:0 6px 14px -6px rgba(0,0,0,.35)}
.stampmark.ok{color:#B07A12}.stampmark.bad{color:var(--bad)}.stampmark.mid{color:var(--teal)}
.stamp-layer{top:10px;left:50%;right:auto;transform:translateX(-50%)}
/* tiles: ivory enamel */
.gtile,.opt,.mt,.tile.key{background:linear-gradient(180deg,#FFFDF8,#F3E7D3);color:var(--ink);border:1px solid rgba(255,255,255,.75);
  box-shadow:inset 0 1px 0 #fff,0 5px 0 #CDB48E,0 12px 18px -8px rgba(0,0,0,.55);font-weight:600}
.gtile{border-radius:18px;min-height:64px;font-size:16.5px}
.weak-btn{background:linear-gradient(180deg,#348A90,#1F5C66);box-shadow:0 5px 0 #123C44}
.bank .bw{background:linear-gradient(180deg,#FFFDF8,#F3E7D3);box-shadow:0 4px 0 #CDB48E}
.gtile .shape{width:30px;height:30px;padding:6px;box-sizing:border-box;border-radius:10px;background:color-mix(in srgb,var(--tc) 14%,transparent)}
.gtile.c0{--tc:#E0795E}.gtile.c1{--tc:#2C7A80}.gtile.c2{--tc:#D9A13A}.gtile.c3{--tc:#6C9A8F}
.gtile:active,.opt:active,.mt:active,.tile.key:active{transform:translateY(4px);box-shadow:inset 0 1px 0 #fff,0 1px 0 #CDB48E,0 4px 8px -4px rgba(0,0,0,.5)}
.gtile.ok{background:linear-gradient(180deg,#FFE9AE,#F2BE4E);color:#4A3000;border-color:#FFF1C8;box-shadow:inset 0 1px 0 #FFF6DA,0 5px 0 #B98526,0 0 0 4px rgba(246,195,91,.3),0 0 34px rgba(246,195,91,.55);animation:win .5s cubic-bezier(.3,1.6,.5,1)}
.gtile.ok::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.6) 45%,transparent 60%);transform:translateX(-120%);animation:sheen .9s .1s ease-out forwards;pointer-events:none}
@keyframes sheen{to{transform:translateX(120%)}}
.gtile.ok .shape{color:#4A3000;background:rgba(255,255,255,.45)}
.gtile.bad{background:#EADCD8;color:var(--badink);border-color:#F3E8E5;box-shadow:inset 0 1px 0 #fff,0 1px 0 #B99A95;transform:translateY(4px);animation:sink .45s ease}
@keyframes sink{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,4px)}60%{transform:translate(-3px,4px)}100%{transform:translateY(4px)}}
.gtile.bad .shape{color:var(--bad)}
.gtile.dim{opacity:.45;transform:scale(.98)}
.opt.ok{background:linear-gradient(180deg,#FFE9AE,#F2BE4E);color:#4A3000;box-shadow:0 5px 0 #B98526}
.opt.bad{background:#EADCD8;color:var(--badink);box-shadow:0 1px 0 #B99A95}
.primary{background:linear-gradient(180deg,#348A90,#1F5C66);color:#FFF4DC;font-weight:800;border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 0 #123C44,0 14px 22px -10px rgba(0,0,0,.6)}
.primary:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 0 #123C44}
.primary[disabled]{opacity:.55}
.ghost{background:var(--glass);border:1px solid rgba(255,255,255,.16);color:var(--paper);font-weight:700}
.honest,.tray-hint{color:#D7E3E4}
/* set pieces */
.marquee{background:none;box-shadow:none;padding:4px 0;color:var(--ink)}
.bulbs{display:none}
.word.mq{color:var(--ink);text-shadow:none}
.mini-play,.play{background:linear-gradient(180deg,#348A90,#1F5C66);color:#FFF4DC;box-shadow:0 3px 0 #123C44}
.play.slow{background:var(--paper2);color:var(--ink);box-shadow:0 3px 0 #CDB48E}
.orb-wrap{background:radial-gradient(70% 90% at 50% 50%,#1D4D5A,#0F2A36);box-shadow:inset 0 0 0 1px rgba(246,195,91,.25)}
.orb-play{background:linear-gradient(180deg,#F8CF74,#E8B44C);color:#3A2A00;box-shadow:0 0 0 8px rgba(246,195,91,.18),0 10px 20px rgba(0,0,0,.35)}
.reveal-word .q{color:#C9B89A}
.ticket{background:linear-gradient(180deg,#FFFDF6,#F8EDD9);box-shadow:0 8px 20px rgba(0,0,0,.12),inset 0 0 0 1.5px rgba(232,180,76,.5)}
.slot{border-color:var(--gold2);background:rgba(246,195,91,.1)}
.slot.ok{border-color:#C98F1E;background:#FFF0C8;color:#5A3B00}
.ticket.won{box-shadow:0 8px 28px rgba(246,195,91,.45),inset 0 0 0 2px #E8B44C}
.tile.key{font-weight:700;font-size:18px}
.face.front{background:linear-gradient(160deg,#EEF5F3,#D9EAE6);box-shadow:inset 0 0 0 1.5px rgba(44,122,128,.35)}
.face.back,.face.back.holo{background:linear-gradient(115deg,#FFFDF8 20%,#FFF1D2 40%,#EAF4F1 55%,#FFFDF8 75%);background-size:300% 100%;box-shadow:inset 0 0 0 1.5px rgba(232,180,76,.5)}
.blank-line{border-bottom-color:var(--teal2)}
.hint,.tapme{color:var(--teal)}
.tapme{background:rgba(44,122,128,.12)}
.bubble-q p{background:linear-gradient(160deg,#EEF5F3,#D9EAE6);color:var(--teal);box-shadow:inset 0 0 0 1.5px rgba(44,122,128,.3)}
.mt.en-t,.mt.he-t{border:1px solid rgba(255,255,255,.75)}
.mt.sel{background:#FFF1CC;box-shadow:0 0 0 3px var(--gold2),0 5px 0 #CDB48E}
.mt.done,.mt.snd.done{background:#E3EFEC;color:var(--teal);box-shadow:none}
.mt.snd{background:linear-gradient(180deg,#348A90,#1F5C66);color:#FFF4DC}
.hs.ok{box-shadow:0 0 0 3px var(--gold),0 0 26px 6px rgba(246,195,91,.55);background:rgba(246,195,91,.14)}
.fb.ok{background:#FFF3D6;color:#5A3B00;box-shadow:inset 0 0 0 1.5px rgba(232,180,76,.55)}
.fb.ok .mark{background:linear-gradient(180deg,#F8CF74,#D9A13A)}
.fb.bad .mark{background:var(--bad)}
.fb.info{background:#E6F1EF;color:var(--teal)}.fb.info .mark{background:var(--teal2)}
.ribbon{background:var(--ink);color:var(--gold);box-shadow:none;font-family:var(--f-disp)}
.pic{background:#F3E7D3}
.dtag{background:var(--paper2);color:#6B5A3E}
.flychip{background:linear-gradient(180deg,#FFE3A6,#F6C35B);color:#4A3000;font-family:var(--f-body);font-weight:900;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.burst{width:8px;height:8px}
.ripple{background:rgba(255,255,255,.55)}
.peeker{display:none}

/* ---------- home: the archipelago ---------- */
#app:has(.h4),#app:has(.e4){padding:0;max-width:none}
.h4,.e4{position:relative;flex:1;min-height:0;overflow:hidden}
.world{position:absolute;inset:0;background:
  radial-gradient(60% 28% at 72% 30%,rgba(255,226,160,.5),transparent 70%),
  linear-gradient(180deg,#123C4C 0%,#2B6676 28%,#D9896A 64%,#F3B67E 100%)}
.world-c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.wlabel{position:absolute;left:0;top:0;z-index:3;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:3px;will-change:transform;transition:opacity .2s}
.wlabel b{font-size:12.5px;font-weight:700;padding:3px 11px;border-radius:999px;background:rgba(12,34,44,.62);color:var(--paper);white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.wlabel i{font-style:normal;font-size:11.5px;font-weight:700;color:var(--ink);background:var(--paper);border-radius:999px;padding:1px 9px;white-space:nowrap}
.wlabel.cur b{font-size:14px;font-weight:800;padding:5px 14px;background:linear-gradient(180deg,#F08C6A,#D9654A);box-shadow:0 4px 0 #A9452F,0 10px 20px -8px rgba(0,0,0,.5)}
.wlabel.ghost b{background:rgba(255,255,255,.14);border:1px dashed rgba(255,255,255,.55)}
.wmargo{position:absolute;left:0;top:0;z-index:4;pointer-events:none;will-change:transform}
.wm-in{display:flex;align-items:flex-end;direction:ltr}
.wm-in .margo{width:66px!important;height:84px!important;filter:drop-shadow(0 8px 8px rgba(0,0,0,.35))}
.wsay{order:2;direction:rtl;background:var(--paper);color:var(--ink);font-size:12.5px;font-weight:600;line-height:1.35;padding:7px 10px;border-radius:14px 14px 14px 4px;width:max-content;max-width:150px;margin-bottom:56px;box-shadow:0 10px 18px -8px rgba(0,0,0,.5);animation:sayIn .5s .7s both cubic-bezier(.2,1.5,.4,1)}
@keyframes sayIn{from{opacity:0;transform:scale(.7) translateY(6px)}}

/* =====================================================================
   M5 · Horizons. Paper and ink for reading; the painted world for wonder.
   One accent family per world (its hour of day); terracotta, ochre and sage are the only UI accents.
   Motion: touch 120ms, feedback 220-350ms, transition 420ms, moments 900-1400ms (the only springy ones).
   ===================================================================== */
:root{
  --bg:#F3EADB;--paper:#FBF5EA;--paper2:#EADDC6;--ink:#2A211D;--muted:#5E4F46;--soft:#8A7A6E;--line:rgba(42,33,29,.14);
  --terra:#B4532F;--terra2:#8E3E22;--ochre:#D99A4B;--sage:#5F8A68;--sagebg:#E4EBDF;--dusk:#2E3150;
  --listen:#B4532F;--gap:#D99A4B;--recall:#5F8A68;--intro:#D99A4B;--match:#B4532F;--scene:#5F8A68;--pick:#2A211D;--reverse:#5F8A68;
  --ok:#5F8A68;--okbg:#E4EBDF;--okink:#2F4E36;--bad:#B4532F;--badbg:#F4E3DA;--badink:#6E2E1A;--gold:#D99A4B;--gold2:#C98A3B;
  --f-he:"Assistant",system-ui,sans-serif;--f-body:"Assistant",system-ui,sans-serif;--f-en:"Fraunces",Georgia,serif;--f-disp:"Fraunces",Georgia,serif;--f-hs:"Frank Ruhl Libre",Georgia,serif;
  --e-std:cubic-bezier(.2,.7,.2,1);--e-moment:cubic-bezier(.3,1.3,.4,1);
}
html,body{background:var(--bg)}
body{color:var(--ink);font-weight:500}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:200;opacity:.09;mix-blend-mode:multiply;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#app{z-index:1}
.word,.reveal-word .w,.fb .w,.hero-title{font-family:var(--f-en)!important;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.sent,.gap-sent,.stress,.tile,.en-tiles .gtile .tt,.mt.en-t,.chip,.cap>.en,.pw .en,.bt .en{font-family:var(--f-en)}
/* Margo rig */
.margo.rig{overflow:visible}
.margo.rig .j{transition:transform .5s var(--e-moment);transform-box:view-box}
.margo.rig .j-ls{transform:rotate(var(--ls))}.margo.rig .j-le{transform:rotate(var(--le))}
.margo.rig .j-rs{transform:rotate(var(--rs))}.margo.rig .j-re{transform:rotate(var(--re))}
.margo.rig .j-hd{transform:rotate(var(--hd))}.margo.rig .j-ll{transform:rotate(var(--ll,0deg))}.margo.rig .j-rl{transform:rotate(var(--rl,0deg))}
.margo.rig .rb{transform-box:view-box;transform-origin:60px 190px;animation:mbr 3.6s ease-in-out infinite}
@keyframes mbr{50%{transform:scale(1.008,.992)}}
.margo.rig.jump .rb{animation:mjmp .7s var(--e-moment)}
@keyframes mjmp{35%{transform:translateY(-16px)}70%{transform:translateY(2px)}}
.margo.rig .scarf-t{transform-box:view-box;animation:msc 2.6s ease-in-out infinite alternate}
@keyframes msc{from{transform:rotate(-4deg)}to{transform:rotate(7deg)}}
.margo.rig .blink{transform-box:fill-box;transform-origin:center;animation:mbl 4.8s infinite}
@keyframes mbl{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.margo.rig[data-pose="walk"] .j-ll{animation:mlegL .55s ease-in-out infinite alternate}
.margo.rig[data-pose="walk"] .j-rl{animation:mlegR .55s ease-in-out infinite alternate}
.margo.rig[data-pose="walk"] .j-ls{animation:marmL .55s ease-in-out infinite alternate}
.margo.rig[data-pose="walk"] .j-rs{animation:marmR .55s ease-in-out infinite alternate}
@keyframes mlegL{from{transform:rotate(-15deg)}to{transform:rotate(15deg)}}
@keyframes mlegR{from{transform:rotate(15deg)}to{transform:rotate(-15deg)}}
@keyframes marmL{from{transform:rotate(-10deg)}to{transform:rotate(22deg)}}
@keyframes marmR{from{transform:rotate(10deg)}to{transform:rotate(-22deg)}}
.margo.rig[data-pose="wave"] .j-re{animation:mwave .42s ease-in-out infinite alternate}
@keyframes mwave{from{transform:rotate(-40deg)}to{transform:rotate(5deg)}}
.margo.rig[data-pose="clap"] .j-le{animation:mclapL .22s ease-in-out infinite alternate}
.margo.rig[data-pose="clap"] .j-re{animation:mclapR .22s ease-in-out infinite alternate}
@keyframes mclapL{from{transform:rotate(-93deg)}to{transform:rotate(-70deg)}}

.margo .f-t{display:none}.margo[data-face="t"] .f-n{display:none}.margo[data-face="t"] .f-t{display:inline}

/* ---------- Horizons world ---------- */
.hz{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.hz-skies,.hz-skyw,.hz-sky{position:absolute;inset:0}
.hz-sky .sun,.hz-sky .sunglow{position:absolute;border-radius:50%}
.hz-sky .sunglow{opacity:.2;animation:hzglow 7s ease-in-out infinite alternate}
@keyframes hzglow{to{opacity:.32;transform:scale(1.08)}}
.hz-sky .stars{position:absolute;top:0;left:0}
.hz-sky .stars circle{animation:hztw 3.6s ease-in-out infinite alternate}
@keyframes hztw{to{opacity:.3}}
.hz-lay{position:absolute;top:0;right:0;height:100%;will-change:transform}
.hz-lay svg{display:block}
.hz .drift>svg,.hz g.drift{animation:hzdrift 70s linear infinite alternate}
@keyframes hzdrift{to{transform:translateX(-60px)}}
.hz svg .sway{transform-box:view-box;animation:hzsway 5.5s ease-in-out infinite alternate}
@keyframes hzsway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
.hz svg .breeze{transform-box:fill-box;transform-origin:50% 100%;animation:hzbreeze 4s ease-in-out infinite alternate}
@keyframes hzbreeze{to{transform:skewX(-4deg)}}
.hz svg .shimmer{animation:hzshim 2.6s ease-in-out infinite alternate}
@keyframes hzshim{to{opacity:.2;transform:translateX(6px)}}
.hz svg .blinkl{animation:hzbl 1.4s steps(2) infinite}
@keyframes hzbl{50%{opacity:.2}}
.hz svg .st{cursor:pointer}
.hz svg .st.poke{transform-box:fill-box;transform-origin:50% 100%;animation:hzpoke .38s var(--e-moment)}
@keyframes hzpoke{40%{transform:translateY(-5px) scale(1.03)}}
.hz svg .pennant .flag{transform-box:view-box;animation:hzflag 1.4s ease-in-out infinite alternate}
@keyframes hzflag{to{transform:skewY(8deg) scaleX(.9)}}
.hz svg .cat .tail{transform-box:view-box;animation:hztail 1.8s ease-in-out infinite alternate}
@keyframes hztail{to{transform:rotate(-24deg)}}
.hz svg .kite{transform-box:view-box;animation:hzkite 3.4s ease-in-out infinite alternate}
@keyframes hzkite{to{transform:translate(6px,-8px) rotate(6deg)}}
.hz-motes{position:absolute;inset:0;pointer-events:none;z-index:8}
.hz-motes i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,246,230,.75);animation:hzmote 9s ease-in-out infinite}
@keyframes hzmote{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(14px,-46px);opacity:0}}
.hz.night .hz-motes i{background:#FFE9A8;box-shadow:0 0 6px 2px rgba(255,220,140,.55)}
.hz-birds{position:absolute;top:16%;left:-80px;z-index:3;pointer-events:none;animation:hzbirds 28s linear infinite}
@keyframes hzbirds{0%{transform:translate(0,0)}100%{transform:translate(640px,-30px)}}
.hz-birds .wing{transform-box:fill-box;transform-origin:50% 100%;animation:hzflap .5s ease-in-out infinite alternate}
.hz-birds .w2{animation-delay:-.2s}.hz-birds .w3{animation-delay:-.35s}
@keyframes hzflap{to{transform:scaleY(.35)}}
.hz.night .hz-birds{display:none}
.hz-pin{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:none;color:#F6EEDF;text-shadow:0 1px 10px rgba(0,0,0,.4);white-space:nowrap;z-index:3}
.hz-pin b{font-family:var(--f-hs);font-size:18px;font-weight:700}
.hz-pin span{font-size:12px;font-weight:700;letter-spacing:.03em;opacity:.9}
.hz-pin.lock{opacity:.72}
.hz-margo{position:absolute;width:54px;height:86px;padding:0;border:0;background:none;z-index:4;cursor:pointer;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.hz-margo .margo{width:54px;height:86px;display:block}
.hz-say{position:absolute;z-index:6;transform:translate(-100%,-100%);width:max-content;max-width:180px;background:var(--paper);color:var(--ink);font-size:13px;font-weight:600;line-height:1.38;padding:8px 11px;border-radius:14px 14px 4px 14px;box-shadow:0 10px 22px -10px rgba(0,0,0,.5);animation:hzsay 6.5s 1s both}
@keyframes hzsay{0%{opacity:0;transform:translate(-100%,-90%) scale(.85)}8%{opacity:1;transform:translate(-100%,-100%)}88%{opacity:1}100%{opacity:0}}
/* session band */
.hz-band .hz-sky{background-size:100% 100%!important}
.hz-bandsvg{position:absolute;inset:0}
.hz-walker{position:absolute;left:0;bottom:6px;width:46px;height:74px;transition:transform .8s var(--e-std);z-index:3;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.hz-walker .margo{width:46px;height:74px;display:block}
.hz-walker.stumble{animation:hzstum .5s ease}
@keyframes hzstum{30%{margin-left:6px;rotate:6deg}70%{margin-left:-2px;rotate:-3deg}}
.hz-band .lamp .halo{transition:opacity .35s}
.hz-band .lamp.on .halo{opacity:.55}
.hz-band .lamp.on .bulb{fill:#FFE3A6;animation:hzlamp .5s var(--e-moment)}
@keyframes hzlamp{40%{r:4.2}}
.hz-band::after{content:"";position:absolute;width:70px;height:2px;top:24px;right:-80px;background:linear-gradient(90deg,transparent,#FFF6E0);border-radius:2px;opacity:0;transform:rotate(-18deg)}
.hz-band.shoot::after{animation:hzshoot 1.1s ease-out}
@keyframes hzshoot{0%{opacity:0;right:-80px;top:20px}15%{opacity:1}100%{opacity:0;right:110%;top:70px}}
/* finale */
.hz-finsvg{position:absolute;inset:0}
.hz-dusk{position:absolute;inset:0;background:linear-gradient(180deg,#141632 0%,rgba(20,22,50,.55) 55%,rgba(20,22,50,0) 100%);opacity:0;animation:hzdusk 2.4s .3s var(--e-std) forwards}
@keyframes hzdusk{to{opacity:.62}}
.hz-fin .lt-on{opacity:0;transform-box:fill-box;transform-origin:center;animation:hzlit .55s var(--e-moment) forwards}
@keyframes hzlit{0%{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.6)}100%{opacity:1;transform:scale(1)}}
.hz-fin .fw{opacity:0;transform-box:fill-box;transform-origin:center;animation:hzfw 1.1s var(--e-std) forwards}
@keyframes hzfw{0%{opacity:0;transform:scale(.1)}30%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
.hz-fin.skip .lt-on,.hz-fin.skip .hz-dusk{animation-duration:.01s;animation-delay:0s!important}
.hz-finmargo{position:absolute;width:76px;height:122px;z-index:4;filter:drop-shadow(0 8px 8px rgba(0,0,0,.3))}
.hz-finmargo .margo{width:76px;height:122px;display:block}

/* ---------- home ---------- */
#app:has(.h5),#app:has(.e5){padding:0}
.h5,.e5{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}

.top5{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:10;display:flex;align-items:center;gap:10px;color:#F6EEDF}

.day5{font-size:13px;font-weight:700;letter-spacing:.03em;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.day5 b{font-family:var(--f-hs);font-size:17px}
.top5 .sync{background:rgba(20,16,14,.28);color:#F6EEDF;height:30px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet5{position:relative;z-index:5;flex:1;min-height:0;margin-top:-24px;background:var(--bg);padding:22px max(22px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:9px;overflow-y:auto}
.sheet5::before{content:"";position:absolute;left:0;right:0;top:-22px;height:24px;background:var(--bg);clip-path:polygon(0 60%,8% 38%,18% 24%,30% 22%,42% 34%,55% 52%,68% 58%,80% 46%,90% 28%,100% 18%,100% 100%,0 100%)}
.kick5{font-size:12.5px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.kick5.light{color:#F6EEDF;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.h5t{font-family:var(--f-hs);font-weight:700;font-size:31px;line-height:1.1;margin:0;color:var(--ink);text-wrap:balance}
.lights5{display:flex;gap:9px;margin-top:4px}
.lights5 i{width:15px;height:15px;border-radius:50%;background:rgba(42,33,29,.12);position:relative}
.lights5 i.on{background:#E8B44C;box-shadow:0 0 0 3px rgba(232,180,76,.18),0 0 12px rgba(232,180,76,.75)}
.lights5 i.gate::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.4px dashed var(--terra)}
.cap5{font-size:13.5px;color:var(--muted)}
.cta5{margin-top:auto;min-height:62px;border:0;border-radius:999px;background:var(--ink);color:#F6EEDF;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 24px 8px 10px;text-align:right;cursor:pointer;transition:transform .12s var(--e-std)}
.cta5:active{transform:scale(.98)}
.cta5>span:first-child{display:flex;flex-direction:column;font-weight:700;font-size:18px;line-height:1.2}
.cta5 small{font-size:12.5px;font-weight:600;opacity:.72}
.cta5 .go5{width:44px;height:44px;flex:none;border-radius:50%;background:var(--terra);display:flex;align-items:center;justify-content:center}
.cta5[disabled]{opacity:.55}
.cta5.small{min-height:56px;margin-top:0}
.links5{display:flex;justify-content:center;gap:4px}
.links5 button{padding:8px 7px;border:0;background:none;font:600 14px var(--f-body);color:var(--muted);cursor:pointer}
.links5 b{font-family:var(--f-hs);color:var(--ink)}

/* ---------- session ---------- */
body.in-session #app{padding:0 0 calc(12px + env(safe-area-inset-bottom,0px));gap:0}
.band5{position:relative;flex:none;height:138px}
.bar5{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:14px;right:14px;z-index:6;display:flex;align-items:center;gap:8px;color:#F6EEDF}
.x5{width:34px;height:34px;border-radius:50%;border:1px solid rgba(246,238,223,.45);background:rgba(20,16,14,.25);color:#F6EEDF;font-size:14px}
.where5{flex:1;font-size:12.5px;font-weight:700;letter-spacing:.03em;text-shadow:0 1px 6px rgba(0,0,0,.4);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pill5{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px;border-radius:999px;background:rgba(20,16,14,.28);color:#F6EEDF;font-weight:800;font-size:13.5px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-variant-numeric:tabular-nums}
.pill5 svg{width:15px;height:15px;color:#FFD99A}
.pill5.bump{animation:bump .4s var(--e-moment)}
.track5{position:absolute;left:-14px;right:-14px;top:124px;height:3px;background:rgba(246,238,223,.15)}
.track5 .fill{height:100%;background:#FFD99A;box-shadow:0 0 8px rgba(255,217,154,.8);border-radius:0}
.combo{background:rgba(20,16,14,.28);border:0;color:#FFD99A}
.q5{position:absolute;top:calc(48px + env(safe-area-inset-top,0px));left:16px;right:auto;max-width:62%;z-index:7;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-weight:600;font-size:13.5px;border-radius:14px 14px 14px 4px}
.q5.fin{top:auto;bottom:calc(100% - min(440px,52vh) + 150px);left:auto;right:96px;border-radius:14px 14px 4px 14px}
.stage-wrap{padding:16px 18px 0;align-items:flex-start;box-sizing:border-box}
.stage{background:none!important;box-shadow:none!important;border-radius:0;overflow:visible;color:var(--ink)}
.stage::before,.stage::after{display:none}
.stage-head{padding:0 0 6px;justify-content:flex-start;gap:8px}
.badge{background:none;color:var(--muted);padding:0;font-size:12.5px;font-weight:800;letter-spacing:.08em}
.badge svg{display:none}
.chip-s{background:none;border:1px solid var(--line);color:var(--muted);font-weight:700}
.stage-in{padding:4px 0 12px;gap:12px}
.prompt{font-family:var(--f-hs);font-weight:500;font-size:21px;color:var(--ink)}
.mean{font-family:var(--f-hs);font-weight:700;font-size:23px}
.sub{color:var(--muted)}
.stage .word{font-size:46px}
.stage .sent{font-size:17.5px!important;line-height:1.55;color:var(--muted);font-weight:500}
.stage .sent mark{background:none;color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--terra);text-decoration-thickness:2px;text-underline-offset:4px}
.stage .stress{color:var(--muted);letter-spacing:.06em;font-size:15px}
.stage .stress b{color:var(--terra)}
.stage.enter{animation:pgIn .42s var(--e-std)}
@keyframes pgIn{from{opacity:0;transform:translateX(-28px)}}
.stage.leave{transform:translateX(40px);opacity:0;transition:transform .17s ease-in,opacity .17s ease-in}
.stamp-layer{top:-2px;left:auto;right:auto;inset-inline-end:0;transform:none}
.stampmark{font-family:var(--f-hs);font-weight:700;font-size:16px;background:var(--paper);border:1.5px solid currentColor;border-radius:999px;padding:1px 12px;transform:none;animation:stIn .35s var(--e-moment) both,stampout .4s ease-in 1.4s forwards}
@keyframes stIn{from{opacity:0;transform:scale(.6)}}
.stampmark.ok{color:var(--sage)}.stampmark.bad{color:var(--terra)}.stampmark.mid{color:var(--ochre)}
.stage:has(.stampmark) .chip-s{visibility:visible}
/* answers */
.actions{padding:0 18px;gap:8px}
.tiles{gap:8px;counter-reset:t}
.gtile,.opt,.mt,.tile.key{background:var(--paper);color:var(--ink);border:1px solid var(--line);box-shadow:0 1px 0 rgba(42,33,29,.06);border-radius:16px;font-weight:600;transition:background .22s,border-color .22s,transform .12s var(--e-std),opacity .22s}

.gtile.ok,.opt.ok{background:var(--sage);border-color:var(--sage);color:#FBF6EC;box-shadow:0 8px 20px -10px rgba(47,78,54,.6);animation:okIn .4s var(--e-moment)}
@keyframes okIn{40%{transform:scale(1.025)}}
.gtile.ok::before{color:#FBF6EC}

.gtile.dim .tt{color:inherit}
.tiles.grid .gtile{min-height:76px}
.tiles.grid .gtile::before{display:none}
.primary{background:var(--ink);color:#F6EEDF;border-radius:999px;box-shadow:none;min-height:56px;font-weight:700;font-size:18px}

.scene{border-radius:16px;box-shadow:0 12px 26px -16px rgba(0,0,0,.5)}
